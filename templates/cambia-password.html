<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Vita Serena - Cambia Password</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="pagina-login">
    <div class="intestazione">
      <h1><span class="logo-serif">Vita</span> <span class="logo-sans">Serena</span></h1>
      <span class="badge">Primo accesso</span>
    </div>

    <div class="card">
      <p style="font-size:14px;color:#6b5a45;margin:0 0 20px;">
        È il tuo primo accesso. Imposta una nuova password personale per continuare.
      </p>

      <form id="form-cambio">
        <label for="nuova-password">Nuova password</label>
        <input type="password" id="nuova-password" required minlength="6">

        <label for="conferma-password">Conferma password</label>
        <input type="password" id="conferma-password" required minlength="6">

        <button type="submit" class="btn-principale">Salva e accedi</button>
        <div class="errore" id="errore-cambio"></div>
      </form>
    </div>
  </div>

  <script src="/static/js/cambia-password.js"></script>
</body>
</html>
